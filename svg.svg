<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Parlante Bencasita">
  <defs>
    <linearGradient id="bodyGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="50%" stop-color="#ff5f6d"/>
      <stop offset="100%" stop-color="#ffcc33"/>
    </linearGradient>
    <radialGradient id="wooferGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffd6a5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7eb6" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="noteGradient" x1="0" x2="1">
      <stop offset="0%" stop-color="#00cfe8"/>
      <stop offset="100%" stop-color="#7effa6"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f7fbff"/>

  <g transform="translate(300,200)" filter="url(#softShadow)">
    <rect x="0" y="0" width="400" height="500" rx="36" fill="url(#bodyGradient)"/>
    <rect x="-18" y="28" width="36" height="444" rx="18" fill="#ffffff" opacity="0.06"/>
    <circle cx="200" cy="240" r="110" fill="#1b1f29" opacity="0.12"/>
    <circle cx="200" cy="240" r="88" fill="url(#wooferGrad)"/>
    <circle cx="200" cy="240" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6"/>
    <circle cx="200" cy="240" r="36" fill="#ffe8f0" opacity="0.12"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="12">
    <path d="M250 240 C180 150, 110 150, 60 240" stroke="#ffd166" stroke-opacity="0.9"/>
    <path d="M280 240 C200 90, 80 90, 40 240" stroke="#f77fbe" stroke-opacity="0.7" stroke-width="10"/>
    <path d="M320 240 C230 40, 90 40, 30 240" stroke="#8ec5ff" stroke-opacity="0.5" stroke-width="8"/>

    <path d="M700 240 C770 150, 840 150, 890 240" stroke="#ffd166" stroke-opacity="0.9"/>
    <path d="M670 240 C750 90, 870 90, 910 240" stroke="#f77fbe" stroke-opacity="0.7" stroke-width="10"/>
    <path d="M630 240 C720 40, 860 40, 920 240" stroke="#8ec5ff" stroke-opacity="0.5" stroke-width="8"/>
  </g>

  <g fill="url(#noteGradient)">
    <g transform="translate(120,120) scale(1.2)">
      <ellipse cx="0" cy="0" rx="14" ry="18"/>
      <rect x="8" y="-40" width="6" height="35" rx="3"/>
      <path d="M14 -40 C34 -48, 54 -40, 64 -36" fill="none" stroke="url(#noteGradient)" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g transform="translate(980,110) scale(1.1)">
      <ellipse cx="0" cy="0" rx="12" ry="16"/>
      <rect x="10" y="-38" width="6" height="34" rx="3"/>
      <g transform="translate(-28,0)">
        <ellipse cx="40" cy="10" rx="12" ry="16"/>
        <rect x="50" y="-30" width="6" height="34" rx="3"/>
        <path d="M16 -30 L88 -16" stroke="url(#noteGradient)" stroke-width="6" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <g transform="translate(920,420) scale(1.0)">
      <ellipse cx="0" cy="0" rx="16" ry="20"/>
      <rect x="10" y="-48" width="6" height="44" rx="3"/>
    </g>

    <g transform="translate(160,480) scale(0.9)">
      <ellipse cx="0" cy="0" rx="10" ry="12"/>
      <rect x="8" y="-32" width="5" height="28" rx="3"/>
      <ellipse cx="32" cy="8" rx="8" ry="10"/>
      <rect x="40" y="-22" width="5" height="28" rx="3" transform="rotate(-18 42 -8)"/>
    </g>
  </g>

  <g>
    <circle cx="200" cy="80" r="6" fill="#ff5f6d" opacity="0.9"/>
    <circle cx="1040" cy="200" r="8" fill="#ffd166" opacity="0.9"/>
    <circle cx="80" cy="320" r="5" fill="#8ec5ff" opacity="0.9"/>
    <circle cx="1060" cy="520" r="6" fill="#7effa6" opacity="0.95"/>
  </g>
</svg>
