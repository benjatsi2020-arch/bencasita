<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bencasita</title>
    <style>
      :root {
        --bg: #f7fbff;
        --panel: #ffffff;
        --shadow: rgba(31, 45, 74, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
      }

      .frame {
        width: min(92vw, 980px);
        background: var(--panel);
        border-radius: 26px;
        box-shadow: 0 18px 42px var(--shadow);
        padding: 24px 26px 18px;
      }

      img {
        display: block;
        width: min(100%, 820px);
        height: auto;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img src="parlante-bencasita.svg" alt="Ilustración de parlante modern Bencasita" />
    </div>
  </body>
</html>
